name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y file pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify Linux native build prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run native:prereqs
      - name: Resolve the tagged source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_commit" = "$(git rev-parse HEAD)"
          echo "FOOD_LOG_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "VITE_FOOD_LOG_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - name: Verify release tag matches the desktop and site version
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(node -p 'require("./package.json").version')" = "$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$(node -p 'require("fs").readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m)[1]')" = "$(node -p 'require("./package.json").version')"
          test "$FOOD_LOG_SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = push ]; then
            default_branch="${{ github.event.repository.default_branch }}"
            git fetch origin "$default_branch:refs/remotes/origin/$default_branch" --depth=1
            test "$FOOD_LOG_SOURCE_COMMIT" = "$(git rev-parse "origin/$default_branch")"
          fi
      - name: Verify the Windows installer contract
        if: matrix.platform == 'windows-latest'
        run: npm run test:unit -- --testNamePattern '@claim:windows-installer'
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Food Log Export Kit ${{ env.RELEASE_TAG }}
          releaseBody: |
            Unsigned desktop builds for macOS, Windows, and Linux. Verify downloads with SHA256SUMS.
            Source commit: ${{ env.FOOD_LOG_SOURCE_COMMIT }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || inputs.release_tag }}
          fetch-depth: 0
      - name: Resolve the tagged source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_commit" = "$(git rev-parse HEAD)"
          echo "FOOD_LOG_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release-assets --pattern 'Food*'
      - name: Create checksums and manifest
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          cd release-assets
          release_files=(*);
          { printf '# source_commit=%s\n' "$FOOD_LOG_SOURCE_COMMIT"; sha256sum "${release_files[@]}"; } > SHA256SUMS
          python3 - <<'PY'
          import json, os
          tag = os.environ['TAG']
          source_commit = os.environ['FOOD_LOG_SOURCE_COMMIT']
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}"
          files = [f for f in os.listdir('.') if f not in {'SHA256SUMS', 'latest.json'}]
          platforms = {
            'macos': [f for f in files if f.endswith('.dmg')],
            'windows': [f for f in files if f.endswith(('.msi', '.exe'))],
            'linux': [f for f in files if f.endswith(('.AppImage', '.deb', '.rpm'))]
          }
          checksums = {}
          with open('SHA256SUMS') as source:
              for line in source:
                  if line.startswith('#'):
                      continue
                  digest, name = line.rstrip().split(maxsplit=1)
                  checksums[name.lstrip('*')] = digest
          with open('latest.json', 'w') as out:
              json.dump({'version': tag.lstrip('v'), 'release_tag': tag, 'source_commit': source_commit, 'platforms': {k: [f'{base}/{name}' for name in v] for k, v in platforms.items()}, 'checksums': checksums}, out, indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
      - name: Verify published installer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir verify-release
          cd verify-release
          grep -Fx "# source_commit=$FOOD_LOG_SOURCE_COMMIT" SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -ge 2
          test "$(find . -maxdepth 1 -name '*.msi' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name '*-setup.exe' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name '*.rpm' | wc -l)" -ge 1
          python3 - <<'PY'
          import json, os
          with open('latest.json') as source:
              latest = json.load(source)
          tag = os.environ['RELEASE_TAG']
          source_commit = os.environ['FOOD_LOG_SOURCE_COMMIT']
          assert latest['version'] == tag.removeprefix('v')
          assert latest['release_tag'] == tag
          assert latest['source_commit'] == source_commit
          assert latest['checksums']
          for platform in ('macos', 'windows', 'linux'):
              assert latest['platforms'][platform]
              assert all(f'/releases/download/{tag}/' in url for url in latest['platforms'][platform])
              for url in latest['platforms'][platform]:
                  assert url.rsplit('/', 1)[-1] in latest['checksums']
          assert sum(url.endswith('.dmg') for url in latest['platforms']['macos']) >= 2
          assert any(url.endswith('.msi') for url in latest['platforms']['windows'])
          assert any(url.endswith('-setup.exe') for url in latest['platforms']['windows'])
          assert any(url.endswith('.AppImage') for url in latest['platforms']['linux'])
          assert any(url.endswith('.deb') for url in latest['platforms']['linux'])
          assert any(url.endswith('.rpm') for url in latest['platforms']['linux'])
          PY
          remote_tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          remote_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$remote_tag_type" = tag ]; then
            remote_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag_sha}" --jq '.object.sha')"
          fi
          test "$remote_tag_sha" = "$FOOD_LOG_SOURCE_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')" = "$FOOD_LOG_SOURCE_COMMIT"
