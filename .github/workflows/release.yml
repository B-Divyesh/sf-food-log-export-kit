name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify the Windows installer contract
        if: matrix.platform == 'windows-latest'
        run: npm run test:unit -- --testNamePattern '@claim:windows-installer'
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          releaseName: Food Log Export Kit ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          releaseBody: Unsigned desktop builds for macOS, Windows, and Linux. Verify downloads with SHA256SUMS.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
        run: gh release download "$TAG" --dir release-assets
      - name: Create checksums and manifest
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import json, os
          tag = os.environ['TAG']
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}"
          files = [f for f in os.listdir('.') if f not in {'SHA256SUMS', 'latest.json'}]
          platforms = {
            'macos': [f for f in files if f.endswith('.dmg')],
            'windows': [f for f in files if f.endswith(('.msi', '.exe'))],
            'linux': [f for f in files if f.endswith(('.AppImage', '.deb'))]
          }
          with open('latest.json', 'w') as out:
              json.dump({'version': tag.lstrip('v'), 'platforms': {k: [f'{base}/{name}' for name in v] for k, v in platforms.items()}}, out, indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
