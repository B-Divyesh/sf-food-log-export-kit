[package]
name = "food-log-export-kit"
version = "0.1.6"
description = "Turn food tracker exports into a local archive"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "food_log_export_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
